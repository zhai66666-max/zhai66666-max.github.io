<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="夜之城"><meta name="theme-color" content="#07070d">
<title>NIGHT CITY // 连接中</title>
<style>
:root{--y:#fcee0a;--c:#5ef2ff;--r:#ff4d6d;--t:#e8f6ff;--d:#8a98ab}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--t);
 font:15px/1.65 "JetBrains Mono",ui-monospace,Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
 background:radial-gradient(ellipse at 50% 35%,#16152a 0,#07070d 65%) fixed,#07070d}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 3px)}
.box{position:relative;width:min(540px,92vw);padding:30px 30px 22px;background:#0b0b14e6;border:1px solid #fcee0a33;
 clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));box-shadow:0 0 40px #fcee0a14 inset}
.box:after{content:"";position:absolute;left:0;top:0;width:4px;height:100%;background:linear-gradient(var(--y),#fcee0a00)}
h1{margin:0;font-size:20px;color:var(--y);letter-spacing:3px;font-weight:800;text-shadow:0 0 12px #fcee0a55}
h1 small{font-size:11px;letter-spacing:1px;color:#0b0b14;background:var(--c);padding:1px 6px;margin-left:8px;vertical-align:3px;font-weight:700;text-shadow:none}
.sub{margin:4px 0 20px;font-size:11px;letter-spacing:2px;color:#5ef2ff99}
#status{font-size:14px;color:var(--t);min-height:44px}
#status:before{content:"▸ ";color:var(--c)}
.bar{height:3px;background:#ffffff10;margin:16px 0 10px;overflow:hidden;position:relative}
.bar i{position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,transparent,var(--c),var(--y));animation:run 1.2s linear infinite}
@keyframes run{to{left:100%}}
.box.err .bar i{animation:none;left:0;width:100%;background:var(--r)}
.box.err{border-color:#ff4d6d55}.box.err:after{background:linear-gradient(var(--r),#ff4d6d00)}
.box.err #status:before{content:"✕ ";color:var(--r)}
.et{font-weight:700;color:#ff8fa3;font-size:15px}
.ed{display:block;margin-top:6px;color:var(--d);font-size:12px;line-height:1.6}
.ec{display:block;margin-top:4px;color:#5a6577;font-size:11px;word-break:break-all}
.foot{font-size:11px;color:#55607a;letter-spacing:1px;display:flex;justify-content:space-between}
p{color:#9fb3c8;font-size:13px;margin:6px 0 16px}
label{display:block;font-size:12px;color:var(--c);margin:14px 0 5px;letter-spacing:1px}
input{width:100%;background:#0f0f1a;border:1px solid #2a2a3d;color:#fff;padding:10px 12px;font:inherit;outline:0}
input:focus{border-color:var(--c);box-shadow:0 0 0 2px #5ef2ff22}
button{margin-top:16px;background:var(--y);color:#000;border:0;padding:10px 20px;font:inherit;font-weight:800;letter-spacing:1px;cursor:pointer;
 clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);transition:filter .15s,transform .15s}
button:hover{filter:brightness(1.12);transform:translateY(-1px)}
button.g{background:transparent;color:var(--c);border:1px solid #5ef2ff66;clip-path:none;margin-left:8px}
#msg{margin-top:14px;font-size:13px;color:var(--r);white-space:pre-wrap}
</style></head><body>
<div class="box" id="ui"><h1>NIGHT CITY // UPLINK<small>入口 v6</small></h1><div class="sub">NEURAL LINK · 夜之城终端</div><div id="status">正在接入夜之城…</div><div class="bar"><i></i></div><div class="foot"><span>LIFE-OS 2077</span><span id="clk"></span></div></div>
<script>
const CFG_KEY='nc2077.hub', CACHE_KEY='nc2077.hub.cache';
const DEFAULT_REPO='zhai66666-max/life-os-2077', PATH='terminal/night-city-terminal.html';
const ui=document.getElementById('ui');setInterval(()=>{const e=document.getElementById('clk');if(e)e.textContent=new Date().toTimeString().slice(0,8)},1000);
const getCfg=()=>{try{return JSON.parse(localStorage.getItem(CFG_KEY))||{}}catch(e){return{}}};
const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),c=>c.charCodeAt(0)));

function boot(html,hub){
  /* 版本看门狗（2026-11-13）：跟终端 html 自身的版本无关，只比对「本页启动时注入的 sha」与线上指针。
     指针一变就重载；重载后 __NC_HUB.sha 等于新指针，条件不再成立，所以只刷一次、不会互相刷。 */
  const watchdog='(function(){var my=window.__NC_HUB&&window.__NC_HUB.sha;if(!my)return;'
    +'var id=setInterval(function(){'
    +'fetch("/nc/latest.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){'
    +'if(j&&j.sha&&j.sha!==my){'
    +'try{if(sessionStorage.getItem("nc2077.bootver")===j.sha){clearInterval(id);return;}'
    +'sessionStorage.setItem("nc2077.bootver",j.sha);sessionStorage.setItem("nc-quiet","1");}catch(e){}'
    +'clearInterval(id);location.reload();}'
    +'}).catch(function(){});},30000);})();';
  const inject='<script>window.__NC_HUB='+JSON.stringify(hub).replace(/</g,'\\u003c')+';'+watchdog+'<\/script>';
  html=html.replace(/<head([^>]*)>/i,m=>m+inject);
  document.open();document.write(html);document.close();
}
function form(err){
  const c=getCfg();
  ui.innerHTML=`<h1>NIGHT CITY // UPLINK<small>入口 v6</small></h1>
  <p>第一次在这台设备使用：填入对 life-os-2077 有 Contents: Read and write 权限的 GitHub 令牌（和终端云同步用同一个）。令牌只保存在这台设备的浏览器里；用完公共设备记得在终端里点「退出此设备」。</p>
  <label>仓库</label><input id="repo" value="${c.repo||DEFAULT_REPO}">
  <label>读写令牌（github_pat_…）</label><input id="tok" type="password" value="${c.token||''}">
  <button id="go">连接</button><div id="msg">${err||''}</div>`;
  document.getElementById('go').onclick=()=>{
    localStorage.setItem(CFG_KEY,JSON.stringify({repo:document.getElementById('repo').value.trim(),token:document.getElementById('tok').value.trim()}));
    location.reload();
  };
}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{
  /* 2026-11-05：先用目录列表（几 KB）拿最新版本号；和本机缓存一致就直接秒开；不一致才下载新版（raw，体积小三分之一，最多等 60 秒，不再 6 秒就退回旧缓存） */
  const c=getCfg();
  if(!c.token){form();return;}
  let cc=null;try{cc=JSON.parse(localStorage.getItem(CACHE_KEY))}catch(_){}
  const hasC=!!(cc&&cc.html);
  const st=t=>{const s=document.getElementById('status');if(s)s.innerHTML=t;};
  const useCache=why=>boot(cc.html,{repo:c.repo,token:c.token,sha:cc.sha,offline:true,why});
  const fail=(why,err)=>{const m={net:'暂时连不上 GitHub',slow:'下载太慢'}[why]||why;
    try{localStorage.setItem('nc2077.hub.err',JSON.stringify({t:new Date().toISOString(),why,err:String(err&&err.message||err||'')}))}catch(_){}
    ui.classList.add('err');const raw=String(err&&(err.name+' '+err.message)||err||'').replace(/</g,'&lt;');
    const tip=/Abort|Failed to fetch|NetworkError|blocked/i.test(raw)?'这台设备连 GitHub 很慢或被拦住了。可以点重试；急用的话先打开本机旧版，数据不会丢。':'可以点重试，或先打开本机旧版。';
    st('<span class="et">'+m+'</span><span class="ed">'+tip+'</span><span class="ec">'+raw+'</span>'+
      '<br><button id="rt">重试</button>'+(hasC?'<button id="uo" class="g">先打开本机旧版</button>':''));
    document.getElementById('rt').onclick=()=>location.reload();const u=document.getElementById('uo');if(u)u.onclick=()=>useCache(why);};
  const tfetch=(u,h,ms)=>{const ac=new AbortController();const to=setTimeout(()=>ac.abort(),ms);return fetch(u,{headers:h,cache:'no-store',signal:ac.signal}).finally(()=>clearTimeout(to));};
  const auth={Authorization:'Bearer '+c.token};
  const bad=async r=>{let gm='';try{gm=(await r.json()).message||''}catch(_){}
    const rl=r.headers.get('x-ratelimit-remaining')==='0'||/rate limit/i.test(gm);
    if(rl){const rs=+r.headers.get('x-ratelimit-reset')||0;const at=rs?new Date(rs*1000).toLocaleTimeString().slice(0,5):'一小时内';
      if(hasC){fail('GitHub 接口限流，'+at+' 恢复','rate limit');return;}form('GitHub 接口暂时限流（不是令牌坏了），'+at+' 自动恢复，到时刷新即可。');return;}
    const why=r.status===401?'令牌无效或已过期，需要在 GitHub 重新生成一个':(r.status===404?'找不到仓库，或令牌没有勾选这个仓库':'令牌没有这个仓库的 Contents 权限，或已被撤销');
    form('连接失败（'+r.status+'）：'+why+'。GitHub 原话：'+(gm||'无')+(hasC?'<br><button id="useCache" style="margin-top:8px">先用本机缓存打开</button>':''));
    const uc=document.getElementById('useCache');if(uc)uc.onclick=()=>useCache('auth');};
  if(!navigator.onLine){if(hasC)fail('这台设备显示没联网','navigator.onLine=false');else st('网络不通，且本地还没有缓存版本。联网后刷新。');return;}
  let sha='',gzName='';
  /* v6（2026-11-05）：电脑连 api.github.com 常超时，版本号改从 github.io 加速节点的 nc/latest.json 取；
     钥匙在本机就完全不碰 api.github.com。钥匙可由 #k=… 一次性链接写入（不会发到服务器）。 */
  try{const m=location.hash.match(/k=([A-Za-z0-9+/=_%-]+)/);if(m){localStorage.setItem('nc2077.hub.k',decodeURIComponent(m[1]));history.replaceState(null,'',location.pathname);}}catch(_){}
  const PB=location.host==='zhai66666-max.github.io'?'':'https://zhai66666-max.github.io';
  try{st('正在核对终端版本…');
    const r=await tfetch(PB+'/nc/latest.json?t='+Date.now(),{},8000);
    if(r.ok){sha=((await r.json()).sha)||'';}
  }catch(e){}
  if(sha&&hasC&&cc.sha===sha){boot(cc.html,{repo:c.repo,token:c.token,sha});return;}
  if(!sha||!localStorage.getItem('nc2077.hub.k')){
  try{
    st('正在核对终端版本（备用通道）…');
    const dir=PATH.replace(/\/[^/]+$/,''),name=PATH.split('/').pop();
    const r=await tfetch(`https://api.github.com/repos/${c.repo}/contents/${dir}`,{...auth,Accept:'application/vnd.github+json'},30000);
    if(!r.ok){await bad(r);return;}
    const ls=await r.json();const e=ls.find(x=>x.name===name);sha=e&&e.sha||'';gzName=sha&&ls.some(x=>x.name==='nct-'+sha+'.gz')?'nct-'+sha+'.gz':'';
    if(sha&&hasC&&cc.sha===sha){boot(cc.html,{repo:c.repo,token:c.token,sha});return;}
  }catch(e){if(!sha){fail('net',e);return;}}
  }
  /* 需要下载新版本 */
  let t0=Date.now(),done=false;
  const tick=setInterval(()=>{if(done)return;const s=Math.round((Date.now()-t0)/1000);
    st('发现新版本，正在下载 · '+s+' 秒'+(hasC&&s>=8?'<br><button id="useOld" class="g" style="margin-left:0">网太慢，先打开旧版</button>':''));
    const b=document.getElementById('useOld');if(b)b.onclick=()=>{done=true;clearInterval(tick);useCache('slow');};},1000);
  try{
    let html=null;
    /* v5：先从 github.io 加速节点下载加密包（约 146 KB），本机解密；钥匙存在私有仓库，只取一次 */
    try{if(sha&&window.crypto&&crypto.subtle&&typeof DecompressionStream!=='undefined'){
      let k=localStorage.getItem('nc2077.hub.k');
      if(!k){const kr=await tfetch(`https://api.github.com/repos/${c.repo}/contents/terminal/sync/hk.json`,{...auth,Accept:'application/vnd.github.raw'},45000);if(kr.ok){k=(await kr.json()).k;try{localStorage.setItem('nc2077.hub.k',k)}catch(_){}}}
      if(k&&!done){const base=location.host==='zhai66666-max.github.io'?'':'https://zhai66666-max.github.io';
        const br=await tfetch(base+'/nc/'+sha+'.bin',{},30000);
        if(br.ok){const b=new Uint8Array(await br.arrayBuffer());
          const key=await crypto.subtle.importKey('raw',Uint8Array.from(atob(k),x=>x.charCodeAt(0)),'AES-GCM',false,['decrypt']);
          const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12));
          html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
          if(!/<html/i.test(html.slice(0,500)))html=null;}}}}catch(e){html=null;}
    if(done)return;
    if(html==null&&gzName&&typeof DecompressionStream!=='undefined'){try{
      const g=await tfetch(`https://api.github.com/repos/${c.repo}/contents/${PATH.replace(/[^/]+$/,gzName)}`,{...auth,Accept:'application/vnd.github.raw'},60000);
      if(g.ok){html=await new Response(g.body.pipeThrough(new DecompressionStream('gzip'))).text();if(!/<html/i.test(html.slice(0,500)))html=null;}
    }catch(e){html=null;}}
    if(done)return;
    if(html==null){
      const r=await tfetch(`https://api.github.com/repos/${c.repo}/contents/${PATH}`,{...auth,Accept:'application/vnd.github.raw'},60000);
      if(done)return;
      if(!r.ok){done=true;clearInterval(tick);await bad(r);return;}
      html=await r.text();}
    if(done)return;done=true;clearInterval(tick);
    try{localStorage.setItem(CACHE_KEY,JSON.stringify({sha,html}))}catch(e){try{localStorage.removeItem(CACHE_KEY);localStorage.setItem(CACHE_KEY,JSON.stringify({sha,html}))}catch(_){}}
    boot(html,{repo:c.repo,token:c.token,sha});
  }catch(e){if(done)return;done=true;clearInterval(tick);fail('net',e);}
})();
</script></body></html>

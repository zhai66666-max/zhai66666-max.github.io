<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="夜之城"><meta name="theme-color" content="#07070d">
<title>NIGHT CITY // 连接中</title>
<style>
body{margin:0;background:#07070d;color:#e8f6ff;font:15px/1.6 ui-monospace,Menlo,Consolas,"PingFang SC",monospace;display:flex;min-height:100vh;align-items:center;justify-content:center}
.box{width:min(520px,92vw);border:1px solid #fcee0a55;padding:28px;box-shadow:0 0 30px #fcee0a22}
h1{margin:0 0 6px;font-size:18px;color:#fcee0a;letter-spacing:2px}
p{color:#9fb3c8;font-size:13px;margin:6px 0 16px}
label{display:block;font-size:12px;color:#5ef2ff;margin:12px 0 4px}
input{width:100%;box-sizing:border-box;background:#0f0f1a;border:1px solid #333;color:#fff;padding:9px;font:inherit}
button{margin-top:18px;background:#fcee0a;color:#000;border:0;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
#msg{margin-top:14px;font-size:13px;color:#ff5ea0;white-space:pre-wrap}
</style></head><body>
<div class="box" id="ui"><h1>NIGHT CITY // UPLINK <small style="font-size:11px;color:#666">入口 v4</small></h1><p id="status">正在从 GitHub 拉取最新终端…</p></div>
<script>
const CFG_KEY='nc2077.hub', CACHE_KEY='nc2077.hub.cache';
const DEFAULT_REPO='zhai66666-max/life-os-2077', PATH='terminal/night-city-terminal.html';
const ui=document.getElementById('ui');
const getCfg=()=>{try{return JSON.parse(localStorage.getItem(CFG_KEY))||{}}catch(e){return{}}};
const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),c=>c.charCodeAt(0)));

function boot(html,hub){
  const inject='<script>window.__NC_HUB='+JSON.stringify(hub).replace(/</g,'\\u003c')+';<\/script>';
  html=html.replace(/<head([^>]*)>/i,m=>m+inject);
  document.open();document.write(html);document.close();
}
function form(err){
  const c=getCfg();
  ui.innerHTML=`<h1>NIGHT CITY // UPLINK</h1>
  <p>第一次在这台设备使用：填入对 life-os-2077 有 Contents: Read and write 权限的 GitHub 令牌（和终端云同步用同一个）。令牌只保存在这台设备的浏览器里；用完公共设备记得在终端里点「退出此设备」。</p>
  <label>仓库</label><input id="repo" value="${c.repo||DEFAULT_REPO}">
  <label>读写令牌（github_pat_…）</label><input id="tok" type="password" value="${c.token||''}">
  <button id="go">连接</button><div id="msg">${err||''}</div>`;
  document.getElementById('go').onclick=()=>{
    localStorage.setItem(CFG_KEY,JSON.stringify({repo:document.getElementById('repo').value.trim(),token:document.getElementById('tok').value.trim()}));
    location.reload();
  };
}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{
  /* 2026-11-05：先用目录列表（几 KB）拿最新版本号；和本机缓存一致就直接秒开；不一致才下载新版（raw，体积小三分之一，最多等 60 秒，不再 6 秒就退回旧缓存） */
  const c=getCfg();
  if(!c.token){form();return;}
  let cc=null;try{cc=JSON.parse(localStorage.getItem(CACHE_KEY))}catch(_){}
  const hasC=!!(cc&&cc.html);
  const st=t=>{const s=document.getElementById('status');if(s)s.innerHTML=t;};
  const useCache=why=>boot(cc.html,{repo:c.repo,token:c.token,sha:cc.sha,offline:true,why});
  const fail=(why,err)=>{const m={net:'连不上 GitHub 接口（api.github.com）',slow:'下载太慢'}[why]||why;
    try{localStorage.setItem('nc2077.hub.err',JSON.stringify({t:new Date().toISOString(),why,err:String(err&&err.message||err||'')}))}catch(_){}
    st('<b style="color:#ff5ea0">'+m+'</b><br><span style="font-size:12px">原因：'+String(err&&(err.name+' '+err.message)||err||'').replace(/</g,'&lt;')+'</span>'+
      '<br><button id="rt" style="margin-top:12px">重试</button> '+(hasC?'<button id="uo" style="margin-top:12px;background:#333;color:#ddd">先打开本机旧版</button>':''));
    document.getElementById('rt').onclick=()=>location.reload();const u=document.getElementById('uo');if(u)u.onclick=()=>useCache(why);};
  const tfetch=(u,h,ms)=>{const ac=new AbortController();const to=setTimeout(()=>ac.abort(),ms);return fetch(u,{headers:h,cache:'no-store',signal:ac.signal}).finally(()=>clearTimeout(to));};
  const auth={Authorization:'Bearer '+c.token};
  const bad=async r=>{let gm='';try{gm=(await r.json()).message||''}catch(_){}
    const rl=r.headers.get('x-ratelimit-remaining')==='0'||/rate limit/i.test(gm);
    if(rl){const rs=+r.headers.get('x-ratelimit-reset')||0;const at=rs?new Date(rs*1000).toLocaleTimeString().slice(0,5):'一小时内';
      if(hasC){fail('GitHub 接口限流，'+at+' 恢复','rate limit');return;}form('GitHub 接口暂时限流（不是令牌坏了），'+at+' 自动恢复，到时刷新即可。');return;}
    const why=r.status===401?'令牌无效或已过期，需要在 GitHub 重新生成一个':(r.status===404?'找不到仓库，或令牌没有勾选这个仓库':'令牌没有这个仓库的 Contents 权限，或已被撤销');
    form('连接失败（'+r.status+'）：'+why+'。GitHub 原话：'+(gm||'无')+(hasC?'<br><button id="useCache" style="margin-top:8px">先用本机缓存打开</button>':''));
    const uc=document.getElementById('useCache');if(uc)uc.onclick=()=>useCache('auth');};
  if(!navigator.onLine){if(hasC)fail('这台设备显示没联网','navigator.onLine=false');else st('网络不通，且本地还没有缓存版本。联网后刷新。');return;}
  let sha='',gzName='';
  try{
    st('正在核对终端版本…');
    const dir=PATH.replace(/\/[^/]+$/,''),name=PATH.split('/').pop();
    const r=await tfetch(`https://api.github.com/repos/${c.repo}/contents/${dir}`,{...auth,Accept:'application/vnd.github+json'},12000);
    if(!r.ok){await bad(r);return;}
    const ls=await r.json();const e=ls.find(x=>x.name===name);sha=e&&e.sha||'';gzName=sha&&ls.some(x=>x.name==='nct-'+sha+'.gz')?'nct-'+sha+'.gz':'';
    if(sha&&hasC&&cc.sha===sha){boot(cc.html,{repo:c.repo,token:c.token,sha});return;}
  }catch(e){fail('net',e);return;}
  /* 需要下载新版本 */
  let t0=Date.now(),done=false;
  const tick=setInterval(()=>{if(done)return;const s=Math.round((Date.now()-t0)/1000);
    st('发现新版本，正在下载… '+s+' 秒'+(hasC&&s>=8?'<br><button id="useOld" style="margin-top:10px;background:#333;color:#ddd">网太慢，先打开旧版</button>':''));
    const b=document.getElementById('useOld');if(b)b.onclick=()=>{done=true;clearInterval(tick);useCache('slow');};},1000);
  try{
    let html=null;
    /* 优先下载压缩包（约 240 KB，比原文件小 3 倍多）；浏览器不支持或失败再下原文件 */
    if(gzName&&typeof DecompressionStream!=='undefined'){try{
      const g=await tfetch(`https://api.github.com/repos/${c.repo}/contents/${PATH.replace(/[^/]+$/,gzName)}`,{...auth,Accept:'application/vnd.github.raw'},60000);
      if(g.ok){html=await new Response(g.body.pipeThrough(new DecompressionStream('gzip'))).text();if(!/<html/i.test(html.slice(0,500)))html=null;}
    }catch(e){html=null;}}
    if(done)return;
    if(html==null){
      const r=await tfetch(`https://api.github.com/repos/${c.repo}/contents/${PATH}`,{...auth,Accept:'application/vnd.github.raw'},60000);
      if(done)return;
      if(!r.ok){done=true;clearInterval(tick);await bad(r);return;}
      html=await r.text();}
    if(done)return;done=true;clearInterval(tick);
    try{localStorage.setItem(CACHE_KEY,JSON.stringify({sha,html}))}catch(e){try{localStorage.removeItem(CACHE_KEY);localStorage.setItem(CACHE_KEY,JSON.stringify({sha,html}))}catch(_){}}
    boot(html,{repo:c.repo,token:c.token,sha});
  }catch(e){if(done)return;done=true;clearInterval(tick);fail('net',e);}
})();
</script></body></html>
